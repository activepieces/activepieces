# Prod-mirror bench stack — parameterized so one compose file serves both
# Kamal tiers we actually care about:
#
#   shared-16cpu (majority prod volume):
#     1 worker container × 16 vCPU / 32 GB / 28 slots / heap 64G / REUSE=false
#   dedicated-05cpu (every dedicated tenant):
#     4 worker containers × 0.5 vCPU / 1 GB / 1 slot / heap 768M / REUSE=true
#
#   Cpuset pins app and worker to disjoint cores so an app-CPU regression
#   can never starve workers by fighting for the same physical cores (prod
#   runs them on separate hosts; we approximate by pinning them to separate
#   cores on one runner):
#     worker → cpuset 0-15   (16 cores — fits the full shared-16cpu container)
#     app    → cpuset 16-17  (2 cores — matches one 2-vCPU app container)
#   Runner is depot-ubuntu-24.04-32 (32 vCPU); cores 18-31 stay unpartitioned
#   for postgres, redis, nginx, minio, autocannon and the kernel.
#
#   Verify at runtime with the "Verify container caps" workflow step, or
#   `docker inspect <container> --format '{{.HostConfig.CpuQuota}}/{{.HostConfig.CpuPeriod}} {{.HostConfig.CpusetCpus}}'`.
#
# All of these are set per-cell by the workflow matrix; defaults are the
# dedicated-05cpu shape so a local `docker compose up` matches most-common
# prod dedicated-tenant behavior:
#   APP_REPLICAS, WORKER_REPLICAS, WORKER_CPUS, WORKER_MEMORY,
#   WORKER_HEAP_MB, AP_WORKER_CONCURRENCY, AP_REUSE_SANDBOX, AP_EXECUTION_MODE.
#
# Not modeled: AP_WORKER_GROUP_ID (routes to a per-tenant queue). The bench
# stack is fresh single-tenant so there is no group to route to; the reuse
# behavior we care about (canReuseSandbox in packages/server/sandbox) does
# not depend on it.

services:
  nginx:
    image: nginx:1.25
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      bench:
        # Static IP so the SANDBOX_PROCESS engine (whose sandbox /etc/resolv.conf points at public
        # DNS 8.8.8.8 and can't resolve the docker-internal "nginx" name) can still reach the server
        # by IP to report flow results. AP_FRONTEND_URL points here.
        ipv4_address: 172.30.0.10

  app:
    image: activepieces-benchmark:local
    build: .
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    environment:
      AP_CONTAINER_TYPE: APP
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_PASSWORD: password
      AP_POSTGRES_USERNAME: postgres
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: 5432
      AP_JWT_SECRET: benchmark-secret-key-for-testing
      AP_ENCRYPTION_KEY: 11020ebf480a9b1648ceec6400beaf26
      AP_FRONTEND_URL: http://172.30.0.10:80
      AP_EXECUTION_MODE: ${AP_EXECUTION_MODE:-SANDBOX_PROCESS}
      AP_NETWORK_MODE: UNRESTRICTED
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: 6379
      AP_ENVIRONMENT: prod
      AP_EDITION: ee
      AP_LOG_LEVEL: error
      AP_TELEMETRY_ENABLED: false
      AP_PROJECT_RATE_LIMITER_ENABLED: false
      AP_SANDBOX_MEMORY_LIMIT: ${AP_SANDBOX_MEMORY_LIMIT:-}
      AP_DEFAULT_CONCURRENT_JOBS_LIMIT: 1000
      AP_FILE_STORAGE_LOCATION: ${AP_FILE_STORAGE_LOCATION:-DB}
      AP_S3_BUCKET: ${AP_S3_BUCKET:-}
      AP_S3_ACCESS_KEY_ID: ${AP_S3_ACCESS_KEY_ID:-}
      AP_S3_SECRET_ACCESS_KEY: ${AP_S3_SECRET_ACCESS_KEY:-}
      AP_S3_ENDPOINT: ${AP_S3_ENDPOINT:-}
      AP_S3_REGION: ${AP_S3_REGION:-}
      AP_S3_USE_SIGNED_URLS: ${AP_S3_USE_SIGNED_URLS:-false}
    cpuset: "16-17"
    deploy:
      replicas: ${APP_REPLICAS:-1}
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - bench

  worker:
    image: activepieces-benchmark:local
    depends_on:
      - app
    environment:
      AP_CONTAINER_TYPE: WORKER
      AP_EDITION: ee
      AP_FRONTEND_URL: http://172.30.0.10:80
      AP_JWT_SECRET: benchmark-secret-key-for-testing
      AP_ENCRYPTION_KEY: 11020ebf480a9b1648ceec6400beaf26
      AP_EXECUTION_MODE: ${AP_EXECUTION_MODE:-SANDBOX_PROCESS}
      AP_NETWORK_MODE: UNRESTRICTED
      AP_REUSE_SANDBOX: ${AP_REUSE_SANDBOX:-false}
      AP_PRE_WARM_CACHE: 'true'
      AP_PROJECT_WORKER: 'false'
      NODE_OPTIONS: --max-old-space-size=${WORKER_HEAP_MB:-768}
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: 6379
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_PASSWORD: password
      AP_POSTGRES_USERNAME: postgres
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: 5432
      AP_LOG_LEVEL: error
      AP_TELEMETRY_ENABLED: false
      AP_WORKER_CONCURRENCY: ${AP_WORKER_CONCURRENCY:-1}
      AP_FILE_STORAGE_LOCATION: ${AP_FILE_STORAGE_LOCATION:-DB}
      AP_S3_BUCKET: ${AP_S3_BUCKET:-}
      AP_S3_ACCESS_KEY_ID: ${AP_S3_ACCESS_KEY_ID:-}
      AP_S3_SECRET_ACCESS_KEY: ${AP_S3_SECRET_ACCESS_KEY:-}
      AP_S3_ENDPOINT: ${AP_S3_ENDPOINT:-}
      AP_S3_REGION: ${AP_S3_REGION:-}
      AP_S3_USE_SIGNED_URLS: ${AP_S3_USE_SIGNED_URLS:-false}
    privileged: true
    cpuset: "0-15"
    deploy:
      replicas: ${WORKER_REPLICAS:-4}
      resources:
        limits:
          cpus: ${WORKER_CPUS:-0.5}
          memory: ${WORKER_MEMORY:-1G}
    networks:
      - bench

  postgres:
    image: postgres:14.4
    environment:
      POSTGRES_DB: activepieces
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bench

  redis:
    image: redis:7.0.7
    networks:
      - bench

volumes:
  postgres_data:

networks:
  bench:
    ipam:
      config:
        - subnet: 172.30.0.0/16
