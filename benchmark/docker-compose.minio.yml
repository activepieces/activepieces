# Overlay that adds a local MinIO (S3-compatible) object store to the benchmark
# stack so the smoke test can exercise the S3 file-storage path end to end.
#
# Usage (the smoke workflow sets AP_FILE_STORAGE_LOCATION=S3 and the AP_S3_* vars):
#   docker compose -f benchmark/docker-compose.yml -f benchmark/docker-compose.minio.yml up -d
#
# The app validates its S3 configuration on boot (system-validator), so the
# bucket must already exist — minio-init creates it before app/worker start.
services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - bench

  minio-ready:
    image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    depends_on:
      minio:
        condition: service_started
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    command: ready local
    networks:
      - bench

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    depends_on:
      minio-ready:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    command: mb --ignore-existing local/activepieces
    networks:
      - bench

  app:
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  worker:
    depends_on:
      app:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

volumes:
  minio_data:
