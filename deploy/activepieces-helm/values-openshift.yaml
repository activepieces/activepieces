# Overlay for OpenShift 4.x under the default `restricted-v2` SCC, and any
# Kubernetes cluster using the PodSecurity `restricted` profile.
#
# Install:
#   helm install activepieces deploy/activepieces-helm \
#     -f deploy/activepieces-helm/values.yaml \
#     -f deploy/activepieces-helm/values-openshift.yaml \
#     -f my-values.yaml
#
# What this overlay changes vs. the base chart:
# - Port moves above 1024 so a non-root pod can bind without NET_BIND_SERVICE.
# - securityContext hardened: non-root, no capabilities, seccomp RuntimeDefault.
# - storageClassName left empty — OpenShift's default CSI class is picked up.
# - AP_EXECUTION_MODE pinned to SANDBOX_CODE_ONLY — the only mode that works
#   without CAP_SYS_ADMIN. Code steps with npm dependencies will fail in this
#   mode; this is a sandboxing limitation, not a bug.
#
# OpenShift ignores runAsUser/fsGroup and assigns its own namespace UID; the
# fields are kept so this overlay also works on vanilla k8s under restricted
# PodSecurity.

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

container:
  port: 8080

persistence:
  storageClassName: ""

activepiecesConfig:
  AP_PORT: "8080"
  AP_EXECUTION_MODE: "SANDBOX_CODE_ONLY"
