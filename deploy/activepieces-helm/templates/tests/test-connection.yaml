apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "activepieces.fullname" . }}-test-connection"
  labels:
    {{- include "activepieces.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      command: ['wget']
      args: ['-O', '/dev/null', '{{ include "activepieces.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
