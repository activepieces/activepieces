project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
base_url: 'https://api.crowdin.com'
preserve_hierarchy: 1
commit_message: New Crowdin translations %original_file_name% (%language%)
append_commit_message: false
files:
  - type: i18next_json
    source: packages/web/public/locales/en/translation.json
    translation: /packages/web/public/locales/%two_letters_code%/translation.json
    languages_mapping:
      two_letters_code:
        zh-CN: zh
        zh-TW: zh-TW
  - type: json
    source: packages/pieces/**/**/src/i18n/translation.json
    translation: /packages/pieces/**/**/src/i18n/%two_letters_code%.json
    languages_mapping:
      two_letters_code:
        zh-CN: zh
        zh-TW: zh-TW
