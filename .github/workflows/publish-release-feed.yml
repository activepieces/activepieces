name: Publish Release Feed

on:
  push:
    branches:
      - main
    paths:
      - releases.json
      - docs/install/reference/releases/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release-feed
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'activepieces/activepieces'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check releases.json and the release note files
        run: |
          bun tools/scripts/release-feed.ts check
          bun tools/scripts/release-feed.ts check-notes

      - name: Publish release feed
        uses: ./.github/actions/publish-release-feed
        with:
          access-key-id: ${{ secrets.CDN_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.CDN_S3_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.CDN_S3_BUCKET }}
          endpoint: ${{ secrets.CDN_S3_ENDPOINT }}

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_ON_CALL_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg url "$RUN_URL" \
            '{content: "🚨 **Publish Release Feed Workflow Failed** 🚨\n\n**Action URL:** \($url)\n\nreleases.json on main was not published to the CDN. Please check the logs for more details."}' \
            | curl --fail --silent --show-error -H "Content-Type: application/json" -X POST -d @- "$WEBHOOK"
