name: Continuous Delivery — Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - deploy-staging              # Re-deploy to staging (e.g., after infra change)

# One deploy run at a time. A newer pending run replaces an older pending one:
# the latest merge still wins. The Cloud gate picks a commit whose two deploy jobs passed.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  build-image:
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Set image tag
        id: set-tag
        run: |
          RELEASE=$(node --print "require('./package.json').version")
          echo "image_tag=${RELEASE}.${{ github.sha }}.beta" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: depot/setup-action@v1
      - uses: depot/build-push-action@v1
        with:
          project: du7O4b0e8P
          token: ${{ secrets.DEPOT_PROJECT_TOKEN }}
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          no-cache: true
          tags: ghcr.io/activepieces/activepieces-cloud:${{ steps.set-tag.outputs.image_tag }}

  deploy-staging-app:
    needs: build-image
    if: always() && needs.build-image.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://stg.activepieces.com
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/ops.key
          chmod 600 ~/.ssh/ops.key
          cat >>~/.ssh/config <<END
          Host ops
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/ops.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.DEV_OPS_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEV_OPS_HOST }}
      - name: Deploy to staging
        run: |
          ssh ops -t -t 'bash -ic "cd mrsk/stg && kamal deploy --version ${{ needs.build-image.outputs.image_tag }} --config-file=config/app.yml --skip-push; exit"'

  deploy-staging-workers:
    needs: build-image
    if: always() && needs.build-image.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://stg.activepieces.com
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/ops.key
          chmod 600 ~/.ssh/ops.key
          cat >>~/.ssh/config <<END
          Host ops
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/ops.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.DEV_OPS_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEV_OPS_HOST }}
      - name: Deploy to staging
        run: |
          ssh ops -t -t 'bash -ic "cd mrsk/stg && kamal deploy --version ${{ needs.build-image.outputs.image_tag }} --config-file=config/worker.yml --skip-push; exit"'

  deploy-stg-cloud:
    needs: build-image
    if: always() && needs.build-image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    environment:
      name: stg-cloud
      url: https://stg-cloud.activepieces.com
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/ops.key
          chmod 600 ~/.ssh/ops.key
          cat >>~/.ssh/config <<END
          Host ops
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/ops.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.DEV_OPS_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEV_OPS_HOST }}
      - name: Deploy to stg-cloud
        run: |
          ssh ops -t -t 'bash -ic "cd mrsk/stg-cloud && kamal deploy --version ${{ needs.build-image.outputs.image_tag }} --skip-push; exit"'
      - name: Release the stg-cloud deploy lock
        if: cancelled()
        run: |
          ssh ops -t -t 'bash -ic "cd mrsk/stg-cloud && kamal lock release; exit"'

  # Records the deploy in the Linear "Staging" release pipeline. Never fails the workflow.
  # Piece commits are left out: pieces ship through npm, not the image.
  linear-release:
    needs: [deploy-staging-app, deploy-staging-workers]
    if: always() && needs.deploy-staging-app.result == 'success' && needs.deploy-staging-workers.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_KEY_STAGING }}
          include_paths: '!packages/pieces/community/**,!packages/pieces/core/**,!packages/pieces/custom/**,!bun.lock,!tsconfig.base.json,!docs/**'
          no_branch_ref_detection: 'true'
          links: Run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
