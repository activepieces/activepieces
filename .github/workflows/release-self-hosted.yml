name: Release Self-Hosted

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., 0.79.2, 0.79.2-hotfix.1)'
        required: true
        type: string
      skip_smoke_test:
        description: 'Skip preflight smoke test'
        required: false
        default: false
        type: boolean
      publish_rc_release:
        description: 'Publish a GitHub Release for RC tags too (ignored for final tags)'
        required: false
        default: false
        type: boolean

jobs:
  # Preflight: build the image and run functional smoke tests + the perf-regression
  # gate (throughput / worker CPU / worker memory). Blocks the release on any
  # regression so we never tag-and-push a build that pegs CPU or tanks throughput.
  preflight:
    if: ${{ !inputs.skip_smoke_test }}
    uses: ./.github/workflows/smoke-test.yml

  release:
    needs: preflight
    if: ${{ always() && !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    concurrency:
      group: release-self-hosted
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    environment:
      name: release
    steps:
      - uses: actions/checkout@v5

      # package.json is the single runtime source of truth for the release version
      # (apVersionUtil.getCurrentRelease reads it), and it is baked into the image from the
      # checked-out source. The `tag` input is free-text, so a mistyped tag would publish an
      # image whose real version disagrees with its tag/git-tag/GitHub-release — invisible until
      # it is mixed with a correctly-built peer and the worker↔app version gate silently
      # withholds jobs. Fail closed here. Hotfix/rc suffixes (0.79.2-hotfix.1, 0.79.2-rc.1) are
      # deploy-only and are not in package.json, so compare against the base X.Y.Z only.
      - name: Verify tag matches package.json
        # TAG is passed via env (not inlined as ${{ inputs.tag }} in the script) to avoid shell
        # expression injection — a crafted tag would otherwise run as shell in the run block.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          PACKAGE_VERSION="$(jq -r .version package.json)"
          TAG_BASE="${TAG%%-*}"
          if [ "$TAG_BASE" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release tag '$TAG' (base '$TAG_BASE') does not match package.json version '$PACKAGE_VERSION'. Bump package.json or fix the tag before releasing."
            exit 1
          fi
          echo "Release tag base '$TAG_BASE' matches package.json version '$PACKAGE_VERSION'."
          CHART_APP_VERSION="$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/activepieces-helm/Chart.yaml)"
          if [ "$CHART_APP_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Helm chart appVersion '$CHART_APP_VERSION' does not match package.json version '$PACKAGE_VERSION'. Bump deploy/activepieces-helm/Chart.yaml."
            exit 1
          fi

      - name: Fail if tag already exists
        run: '! docker manifest inspect activepieces/activepieces:${{ inputs.tag }}'

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Create git tag
        env:
          TAG: ${{ inputs.tag }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git tag "$TAG"
          git -c http.https://github.com/.extraheader= push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"

      - name: Check if this release is the newest
        id: latest
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="$(gh release view --json tagName --jq .tagName)"
          HIGHEST="$(printf '%s\n%s\n' "$CURRENT" "$TAG" | sort -V | tail -1)"
          echo "latest=$([ "$HIGHEST" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: depot/setup-action@v1

      - name: Build and push
        id: build
        uses: depot/build-push-action@v1
        with:
          project: du7O4b0e8P
          token: ${{ secrets.DEPOT_PROJECT_TOKEN }}
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: |
            activepieces/activepieces:${{ inputs.tag }}
            ghcr.io/activepieces/activepieces:${{ inputs.tag }}

      - name: Create or update changelog via release-drafter
        if: ${{ !contains(inputs.tag, '-rc') || inputs.publish_rc_release }}
        uses: release-drafter/release-drafter@v7
        with:
          commitish: ${{ github.ref_name }}
          prerelease: ${{ contains(inputs.tag, '-rc') }}
          tag: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          version: ${{ inputs.tag }}
          latest: ${{ !contains(inputs.tag, '-rc') && steps.latest.outputs.latest == 'true' }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Internal-only for now.
      # To expose them on the GitHub Release for supply-chain audits,
      # set upload-release: 'true'
      # and pass github-token: ${{ secrets.GITHUB_TOKEN }}.
      - uses: ./.github/actions/sbom
        with:
          image: ghcr.io/activepieces/activepieces:${{ inputs.tag }}
          version: ${{ inputs.tag }}

      - name: Notify on-call channel
        if: ${{ !contains(inputs.tag, '-rc') || inputs.publish_rc_release }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_ON_CALL_WEBHOOK }}
          TAG: ${{ inputs.tag }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"📦 **Self-hosted $TAG released**\\n\\n**Docker image:** \`activepieces/activepieces:$TAG\` (also on ghcr.io)\\n**Changelog:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG\\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK"

  # Records the release in the Linear "Self-hosted" release pipeline once the image is published,
  # even when a later step of the release job fails.
  # Minor tags live on release branches, so the scan starts at the merge-base with the previous release tag.
  linear-release:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.digest != '' && !contains(inputs.tag, '-rc') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Find the scan base
        id: base
        env:
          TAG: ${{ inputs.tag }}
        run: |
          PREVIOUS=$(git tag | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-hotfix\.[0-9]+)?$' | grep -vx "$TAG" | { cat; echo "$TAG"; } | sort -V | grep -B1 -x "$TAG" | head -1)
          echo "Previous release: $PREVIOUS"
          echo "sha=$(git merge-base "$PREVIOUS" HEAD)" >> "$GITHUB_OUTPUT"
      - uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_KEY_SELF_HOSTED }}
          version: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          base_ref: ${{ steps.base.outputs.sha }}
          include_paths: '!packages/pieces/community/**,!packages/pieces/core/**,!packages/pieces/custom/**,!bun.lock,!tsconfig.base.json,!docs/**'
          no_branch_ref_detection: 'true'
          links: Run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  sync-version-to-main:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.CROWDIN_PRS }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Roll unreleased breaking changes under the released version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          bun tools/scripts/breaking-changes-rollover.ts "$TAG"

      - name: Check if main version is behind release
        id: compare
        env:
          TAG: ${{ inputs.tag }}
        run: |
          TAG_BASE="${TAG%%-*}"
          MAIN_VERSION="$(jq -r .version package.json)"
          HIGHEST="$(printf '%s\n%s\n' "$MAIN_VERSION" "$TAG_BASE" | sort -V | tail -1)"
          if [ "$HIGHEST" = "$MAIN_VERSION" ]; then
            echo "main version $MAIN_VERSION is not behind released $TAG_BASE, nothing to sync."
          else
            echo "main version $MAIN_VERSION is behind released $TAG_BASE, opening sync PR."
            echo "tag_base=$TAG_BASE" >> $GITHUB_OUTPUT
          fi

      - name: Push sync branch
        id: push
        env:
          TAG: ${{ inputs.tag }}
          TAG_BASE: ${{ steps.compare.outputs.tag_base }}
        run: |
          git config --local user.email "abdulyki+automatedcommits@activepieces.com"
          git config --local user.name "automated-commits-ap"
          if [ -n "$TAG_BASE" ]; then
            npm pkg set version="$TAG_BASE"
            sed -i -E "s|(image: ghcr.io/activepieces/activepieces:)[0-9][0-9a-zA-Z.-]*|\1$TAG|" docker-compose.yml
            grep -q "image: ghcr.io/activepieces/activepieces:$TAG" docker-compose.yml
            sed -i -E "s|^appVersion: .*|appVersion: \"$TAG_BASE\"|" deploy/activepieces-helm/Chart.yaml
          fi
          if git diff --quiet; then
            echo "main already matches $TAG, nothing to sync."
            exit 0
          fi
          BRANCH="automated/sync-main-$TAG"
          git checkout -b "$BRANCH"
          git add package.json docker-compose.yml deploy/activepieces-helm/Chart.yaml docs/install/reference/breaking-changes.mdx docs/install/reference/breaking-changes-unreleased.mdx
          git commit -m "chore(release): sync main after $TAG"
          git push -f origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Open sync PR
        if: steps.push.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.CROWDIN_PRS }}
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          BODY="$(printf '%s\n' \
            "The self-hosted release \`$TAG\` was published. This PR syncs \`package.json\` and the \`docker-compose.yml\` image pin when \`main\` is behind, and moves the breaking-change entries that \`$TAG\` contains from the hidden unreleased page under \`## $TAG\` on the Breaking Changes page. Merge before the next release-candidate cut (Thursday 5 PM UTC). See GIT-1595 and SRE-232." \
            "" \
            "### Breaking change?" \
            "" \
            "- [x] no, reviewed, not breaking (entries are moved, none added)" \
            "- [ ] yes, technical" \
            "- [ ] yes, functional" \
            "" \
            "### Security impact?" \
            "" \
            "- [x] no, reviewed, no security impact" \
            "- [ ] yes, security-sensitive")"
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            echo "An open sync PR from $BRANCH already exists, refreshing its body for $TAG."
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -X PATCH -f body="$BODY"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): sync main after $TAG" \
              --body "$BODY" \
              --label skip-changelog \
              --label automated
          fi
