name: Release Self-Hosted

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., 0.79.2, 0.79.2-hotfix.1)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-24.04
    environment:
      name: release
    steps:
      - uses: actions/checkout@v4

      - name: Fail if tag already exists
        run: '! docker manifest inspect activepieces/activepieces:${{ inputs.tag }}'

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Create git tag
        env:
          TAG: ${{ inputs.tag }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git tag "$TAG"
          git -c http.https://github.com/.extraheader= push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: depot/setup-action@v1

      - name: Build and push
        uses: depot/build-push-action@v1
        with:
          project: du7O4b0e8P
          token: ${{ secrets.DEPOT_PROJECT_TOKEN }}
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: |
            activepieces/activepieces:${{ inputs.tag }}
            ghcr.io/activepieces/activepieces:${{ inputs.tag }}

      - name: Check if this release is the newest
        id: latest
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! CURRENT="$(gh release view --json tagName --jq .tagName)"; then
            echo "::warning::Could not read the current Latest release, so $TAG is not marked Latest. Mark it by hand if it is the newest release."
            echo "latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HIGHEST="$(printf '%s\n%s\n' "$CURRENT" "$TAG" | sort -V | tail -1)"
          echo "latest=$([ "$HIGHEST" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create or update changelog via release-drafter
        uses: release-drafter/release-drafter@v7
        with:
          commitish: ${{ github.ref_name }}
          prerelease: false
          tag: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          version: ${{ inputs.tag }}
          latest: ${{ !contains(inputs.tag, '-rc') && steps.latest.outputs.latest == 'true' }}
          publish: true
          token: ${{ steps.app-token.outputs.token }}
