name: Continuous Delivery — Rollback

on:
  workflow_dispatch:
    inputs:
      rollback_to_image_tag:
        description: 'Image tag to roll back TO, from the previous deploy run (e.g. 0.92.3.abc1234.beta)'
        required: true
      target:
        description: 'Environment to roll back'
        type: choice
        options:
          - prod
          - stg
        default: prod
      force:
        description: 'Roll back even if a breaking migration ran after the target tag'
        type: boolean
        default: false

concurrency:
  group: ${{ inputs.target == 'prod' && 'promote-production' || 'staging-deploy' }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'prod' && 'production' || 'staging' }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/ops.key
          chmod 600 ~/.ssh/ops.key
          cat >>~/.ssh/config <<END
          Host ops
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/ops.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.DEV_OPS_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEV_OPS_HOST }}

      - name: Get current tag
        id: current
        run: |
          OUTPUT=$(ssh ops -t -t 'bash -ic "cd mrsk/${{ inputs.target }} && kamal app version --primary --config-file=config/app.yml 2>&1; exit"' | tr -d '\r')
          CURRENT=$(echo "$OUTPUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[a-f0-9]{40}\.(beta|pick)' | head -1)
          SHA=$(echo "$CURRENT" | cut -d. -f4)
          if [ -z "$SHA" ]; then
            echo "$OUTPUT"
            echo "Could not read the current tag of ${{ inputs.target }}"
            exit 1
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Rolling back ${{ inputs.target }} from $CURRENT to ${{ inputs.rollback_to_image_tag }}"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.current.outputs.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared and server-utils packages
        run: bunx turbo run build --filter=@activepieces/shared --filter=@activepieces/server-utils

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract migration manifest from target image
        id: manifest
        run: |
          IMAGE="ghcr.io/activepieces/activepieces-cloud:${{ inputs.rollback_to_image_tag }}"
          docker pull "$IMAGE"
          MANIFEST=$(docker run --rm --entrypoint cat "$IMAGE" \
            /usr/src/app/packages/server/api/dist/src/migration-manifest.json)
          echo "json=$MANIFEST" >> $GITHUB_OUTPUT

      - name: Check for breaking migrations
        id: check
        run: bunx tsx tools/scripts/check-manifest-migrations.ts '${{ steps.manifest.outputs.json }}'

      - name: Fail on breaking migrations
        if: steps.check.outputs.has_breaking == 'true' && !inputs.force
        run: |
          echo "Breaking migrations ran after the target tag: ${{ steps.check.outputs.breaking_names }}"
          echo "The old code may not run on this schema. Fix forward, or rerun with force."
          exit 1

      - name: Redeploy workers to target image
        run: |
          ssh ops -t -t 'bash -ic "cd mrsk/${{ inputs.target }} && kamal deploy \
            --version ${{ inputs.rollback_to_image_tag }} \
            --config-file=config/worker.yml --skip-push; exit"'

      - name: Redeploy app to target image
        run: |
          ssh ops -t -t 'bash -ic "cd mrsk/${{ inputs.target }} && kamal deploy \
            --version ${{ inputs.rollback_to_image_tag }} \
            --config-file=config/app.yml --skip-push; exit"'
