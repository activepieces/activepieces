name: Continuous Delivery — Release

on:
  schedule:
    - cron: '0 14 * * 2' # Every Tuesday at 14:00 UTC
  workflow_dispatch:

jobs:
  weekly-release:
    runs-on: ubuntu-24.04
    environment:
      name: release
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: release-candidate

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared and server-utils packages
        run: bunx turbo run build --filter=@activepieces/shared --filter=@activepieces/server-utils

      - name: Set version from package.json
        id: version
        run: |
          RELEASE=$(node --print "require('./package.json').version")
          echo "release=$RELEASE" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if Docker tag already exists with a different digest
        run: |
          VERSION=${{ steps.version.outputs.release }}
          CANDIDATE_DIGEST=$(docker buildx imagetools inspect --raw ghcr.io/activepieces/activepieces-cloud:release-candidate | sha256sum | awk '{print $1}')
          EXISTING_RAW=$(docker buildx imagetools inspect --raw activepieces/activepieces:$VERSION 2>/dev/null || true)
          if [[ -z "$EXISTING_RAW" ]]; then
            echo "Tag $VERSION does not exist yet — proceeding."
            exit 0
          fi
          EXISTING_DIGEST=$(echo "$EXISTING_RAW" | sha256sum | awk '{print $1}')
          if [[ "$EXISTING_DIGEST" == "$CANDIDATE_DIGEST" ]]; then
            echo "Tag $VERSION already exists and matches release-candidate digest — idempotent rerun, proceeding."
            exit 0
          fi
          echo "Tag $VERSION already exists with a different digest — refusing to overwrite."
          exit 1

      - name: Check for breaking migrations
        id: migration-check
        run: bunx tsx tools/scripts/check-release-migrations.ts ${{ steps.version.outputs.release }}

      - name: Create or update changelog via release-drafter
        uses: release-drafter/release-drafter@v7
        with:
          commitish: main
          prerelease: false
          tag: ${{ steps.version.outputs.release }}
          name: ${{ steps.version.outputs.release }}
          version: ${{ steps.version.outputs.release }}
          latest: true
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create git tag
        run: |
          git tag -f ${{ steps.version.outputs.release }}
          git push origin ${{ steps.version.outputs.release }} --force

      - name: Publish release images
        run: |
          docker buildx imagetools create \
            --tag activepieces/activepieces:${{ steps.version.outputs.release }} \
            --tag activepieces/activepieces:latest \
            --tag ghcr.io/activepieces/activepieces:${{ steps.version.outputs.release }} \
            --tag ghcr.io/activepieces/activepieces:latest \
            ghcr.io/activepieces/activepieces-cloud:release-candidate

      # Internal-only for now.
      # To expose them on the GitHub Release for supply-chain audits,
      # set upload-release: 'true'
      # and pass github-token: ${{ secrets.GITHUB_TOKEN }}.
      - uses: ./.github/actions/sbom
        with:
          image: ghcr.io/activepieces/activepieces:${{ steps.version.outputs.release }}
          version: ${{ steps.version.outputs.release }}

      - name: Add breaking migration note to release
        if: steps.migration-check.outputs.has_breaking == 'true'
        run: |
          VERSION=${{ steps.version.outputs.release }}
          BODY=$(gh release view "$VERSION" --json body -q .body)

          NOTE=$(cat <<EOF

          ---

          > **Note:** This release includes database changes that can't be automatically rolled back (${{ steps.migration-check.outputs.breaking_names }}). See the [rollback guide](https://www.activepieces.com/docs/install/guides/rollback) for details.
          EOF
          )

          gh release edit "$VERSION" --notes "${BODY}${NOTE}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-main:
    needs: weekly-release
    if: ${{ !cancelled() && needs.weekly-release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.CROWDIN_PRS }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Roll unreleased breaking changes under the released version
        env:
          TAG: ${{ needs.weekly-release.outputs.release }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          bun tools/scripts/breaking-changes-rollover.ts "$TAG"

      - name: Push sync branch
        id: push
        env:
          TAG: ${{ needs.weekly-release.outputs.release }}
        run: |
          git config --local user.email "abdulyki+automatedcommits@activepieces.com"
          git config --local user.name "automated-commits-ap"
          if git diff --quiet; then
            echo "No breaking-change entry to roll over for $TAG."
            exit 0
          fi
          BRANCH="automated/sync-main-$TAG"
          git checkout -b "$BRANCH"
          git add docs/install/reference/breaking-changes.mdx docs/install/reference/breaking-changes-unreleased.mdx
          git commit -m "chore(release): sync main after $TAG"
          git push -f origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Open sync PR
        if: steps.push.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.CROWDIN_PRS }}
          TAG: ${{ needs.weekly-release.outputs.release }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          BODY="$(printf '%s\n' \
            "The self-hosted release \`$TAG\` was published. This PR moves the breaking-change entries that \`$TAG\` contains from the hidden unreleased page under \`## $TAG\` on the Breaking Changes page. See SRE-232." \
            "" \
            "### Breaking change?" \
            "" \
            "- [x] no, reviewed, not breaking (entries are moved, none added)" \
            "- [ ] yes, technical" \
            "- [ ] yes, functional" \
            "" \
            "### Security impact?" \
            "" \
            "- [x] no, reviewed, no security impact" \
            "- [ ] yes, security-sensitive")"
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -X PATCH -f body="$BODY"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): sync main after $TAG" \
              --body "$BODY" \
              --label skip-changelog \
              --label automated
          fi
