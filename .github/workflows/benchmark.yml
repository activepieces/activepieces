name: Benchmark

on:
  workflow_dispatch:
    inputs:
      total_requests:
        description: 'Total number of requests for the benchmark'
        required: false
        default: '500'
  schedule:
    - cron: '0 3 * * *'

jobs:
  benchmark:
    runs-on: depot-ubuntu-24.04-32
    timeout-minutes: 30
    env:
      AP_FILE_STORAGE_LOCATION: ${{ secrets.AP_FILE_STORAGE_LOCATION }}
      AP_EXECUTION_MODE: SANDBOX_PROCESS
      AP_S3_BUCKET: ${{ secrets.AP_S3_BUCKET }}
      AP_S3_ACCESS_KEY_ID: ${{ secrets.AP_S3_ACCESS_KEY_ID }}
      AP_S3_SECRET_ACCESS_KEY: ${{ secrets.AP_S3_SECRET_ACCESS_KEY }}
      AP_S3_ENDPOINT: ${{ secrets.AP_S3_ENDPOINT }}
      AP_S3_REGION: ${{ secrets.AP_S3_REGION }}
      AP_S3_USE_SIGNED_URLS: ${{ secrets.AP_S3_USE_SIGNED_URLS }}
      TOTAL_REQUESTS: ${{ inputs.total_requests || '500' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Majority prod volume: one big container, 28 slots, huge heap, cold-every-job.
          - label: "shared-16cpu"
            apps: 1
            workers: 1
            worker_cpus: '16'
            worker_memory: '32G'
            worker_concurrency: '28'
            worker_heap_mb: '64512'
            reuse: 'false'
            total_slots: 28
          # Every dedicated tenant: 4 small workers per host, 1 slot each, warm reuse.
          - label: "dedicated-05cpu"
            apps: 1
            workers: 4
            worker_cpus: '0.5'
            worker_memory: '1G'
            worker_concurrency: '1'
            worker_heap_mb: '768'
            reuse: 'true'
            total_slots: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install monorepo deps (for CLI)
        run: bun install --frozen-lockfile

      - name: Build Docker image
        run: docker build -t activepieces-benchmark:local .

      - name: Start benchmark stack
        run: |
          APP_REPLICAS=${{ matrix.apps }} \
          WORKER_REPLICAS=${{ matrix.workers }} \
          WORKER_CPUS=${{ matrix.worker_cpus }} \
          WORKER_MEMORY=${{ matrix.worker_memory }} \
          WORKER_HEAP_MB=${{ matrix.worker_heap_mb }} \
          AP_WORKER_CONCURRENCY=${{ matrix.worker_concurrency }} \
          AP_REUSE_SANDBOX=${{ matrix.reuse }} \
            docker compose -f benchmark/docker-compose.yml up -d
          echo "Waiting for containers to start..."
          sleep 5
          docker compose -f benchmark/docker-compose.yml ps

      - name: Verify container caps (proves the per-cell shape, cpuset partitioned)
        run: |
          echo "=== Container CPU / memory / cpuset (as Docker actually applied) ==="
          for c in $(docker compose -f benchmark/docker-compose.yml ps -q); do
            docker inspect "$c" --format '{{.Name}}  quota={{.HostConfig.CpuQuota}}  period={{.HostConfig.CpuPeriod}}  cpuset={{if .HostConfig.CpusetCpus}}{{.HostConfig.CpusetCpus}}{{else}}(any){{end}}  memBytes={{.HostConfig.Memory}}'
          done
          echo
          echo "Effective vCPU = quota / period.  Expected this cell:"
          echo "  app    → 2.00 vCPU (200000/100000)   cpuset 16-17"
          echo "  worker → ${{ matrix.worker_cpus }} vCPU                cpuset 0-15 (${{ matrix.workers }} replica(s))"

      - name: Setup flow, platform API key, and wait for app
        id: setup
        run: |
          chmod +x benchmark/setup.sh
          FLOW_ID=$(benchmark/setup.sh)
          echo "flow_id=$FLOW_ID" >> "$GITHUB_OUTPUT"
          echo "Flow ID: $FLOW_ID"
          test -f /tmp/bench-api-key || { echo "ERROR: /tmp/bench-api-key missing"; exit 1; }
          test -f /tmp/bench-project-id || { echo "ERROR: /tmp/bench-project-id missing"; exit 1; }
          PROJECT_ID=$(cat /tmp/bench-project-id)
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Project ID: $PROJECT_ID"

      - name: Load bench API key (masked)
        run: |
          set -euo pipefail
          KEY=$(cat /tmp/bench-api-key)
          echo "::add-mask::$KEY"
          echo "AP_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Start docker stats capture
        run: |
          rm -f /tmp/stats.jsonl
          touch /tmp/bench-running
          (
            while [ -f /tmp/bench-running ]; do
              docker stats --no-stream --format '{{json .}}' \
                >> /tmp/stats.jsonl 2>/dev/null || true
              sleep 2
            done
          ) &
          echo "STATS_PID=$!" >> "$GITHUB_ENV"

      - name: Run benchmark (activepieces CLI)
        run: |
          set -o pipefail
          bun run packages/cli/src/benchmark-only.ts \
            --url http://localhost:8080 \
            --requests "${TOTAL_REQUESTS}" \
            --concurrency ${{ matrix.total_slots }} \
            --project-id "${{ steps.setup.outputs.project_id }}" \
            --flow-id "${{ steps.setup.outputs.flow_id }}" \
            --json > /tmp/report.json
          echo "--- run summary ---"
          jq '.runs[0].summary, .runs[0].timeline' /tmp/report.json

      - name: Stop docker stats capture
        if: always()
        run: |
          rm -f /tmp/bench-running
          if [[ "${STATS_PID:-}" =~ ^[1-9][0-9]*$ ]]; then
            for _ in 1 2 3; do
              if ! kill -0 "$STATS_PID" 2>/dev/null; then break; fi
              sleep 1
            done
            kill "$STATS_PID" 2>/dev/null || true
          fi
          wc -l /tmp/stats.jsonl 2>/dev/null || true

      - name: Combine results
        if: '!cancelled()'
        run: |
          node benchmark/aggregate-stats.mjs /tmp/stats.jsonl > /tmp/stats.json
          node benchmark/combine-results.mjs \
            --report /tmp/report.json \
            --stats /tmp/stats.json \
            --sha "${{ github.sha }}" \
            --label "${{ matrix.label }}" \
            --runId "${{ github.run_id }}" \
            --out /tmp/result.json
          cat /tmp/result.json

      - name: Detect regression against trailing 14 runs (scheduled runs only)
        if: '!cancelled() && github.event_name == ''schedule'''
        env:
          CH_HOST: ${{ secrets.CLICKHOUSE_CI_HOST }}
          CH_USER: ${{ secrets.CLICKHOUSE_CI_USER }}
          CH_PASS: ${{ secrets.CLICKHOUSE_CI_PASSWORD }}
          BETTERSTACK_WEBHOOK_URL: ${{ secrets.BETTERSTACK_WEBHOOK_URL }}
        run: |
          node benchmark/detect-regression.mjs \
            --current /tmp/result.json \
            --label "${{ matrix.label }}" \
            --runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Insert result into ClickHouse (scheduled runs only)
        if: '!cancelled() && github.event_name == ''schedule'''
        env:
          CH_HOST: ${{ secrets.CLICKHOUSE_CI_HOST }}
          CH_USER: ${{ secrets.CLICKHOUSE_CI_USER }}
          CH_PASS: ${{ secrets.CLICKHOUSE_CI_PASSWORD }}
        run: |
          set -o pipefail
          ROW=$(jq -c '{
            ts: (.meta.ts | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601),
            sha: .meta.sha,
            label: .meta.label,
            run_id: (.meta.runId | tonumber),
            p50_ms: .latency.p50Ms,
            p90_ms: .latency.p90Ms,
            p99_ms: .latency.p99Ms,
            mean_ms: .latency.meanMs,
            req_sec: .throughput.reqSec,
            queue_p90_ms: .timeline.queueWaitP90Ms,
            service_p90_ms: .timeline.serviceP90Ms,
            provision_p50_ms: .timeline.provisionP50Ms,
            boot_p50_ms: .timeline.bootP50Ms,
            app_cpu_p95: (.resources.app.cpuPct.p95 // 0),
            app_mem_max_mb: (.resources.app.memMb.max // 0),
            worker_cpu_p95: (.resources.worker.cpuPct.p95 // 0),
            worker_mem_max_mb: (.resources.worker.memMb.max // 0),
            raw: tojson
          }' /tmp/result.json)
          echo "Row (raw omitted):"
          echo "$ROW" | jq 'del(.raw)'
          printf '%s\n' "$ROW" | curl -sS --fail-with-body \
            --user "$CH_USER:$CH_PASS" \
            --data-binary @- \
            "https://$CH_HOST:8443/?query=INSERT+INTO+bench.results+FORMAT+JSONEachRow"
          echo "ClickHouse insert OK"

      - name: Upload artifact (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-${{ matrix.label }}
          path: |
            /tmp/report.json
            /tmp/stats.json
            /tmp/stats.jsonl
            /tmp/result.json

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f benchmark/docker-compose.yml logs --tail=100

      - name: Teardown
        if: always()
        run: docker compose -f benchmark/docker-compose.yml down -v

  summary:
    runs-on: ubuntu-latest
    needs: benchmark
    if: always()
    steps:
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: benchmark-results-*
          path: /tmp/results

      - name: Generate comparison table
        run: |
          echo "## Benchmark Results Comparison" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Config | Throughput | Client p90 | Client p99 | Queue p90 | Service p90 | Worker mem | Worker cpu p95 | App mem |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          for dir in /tmp/results/benchmark-results-*/; do
            label=$(basename "$dir" | sed 's/benchmark-results-//')
            json="$dir/result.json"
            if [ -f "$json" ]; then
              throughput=$(jq -r '.throughput.reqSec // 0' "$json")
              p90=$(jq -r '.latency.p90Ms // 0' "$json")
              p99=$(jq -r '.latency.p99Ms // 0' "$json")
              qp90=$(jq -r '.timeline.queueWaitP90Ms // 0' "$json")
              sp90=$(jq -r '.timeline.serviceP90Ms // 0' "$json")
              wmem=$(jq -r '.resources.worker.memMb.max // 0' "$json")
              wcpu=$(jq -r '.resources.worker.cpuPct.p95 // 0' "$json")
              amem=$(jq -r '.resources.app.memMb.max // 0' "$json")
              printf "| %s | %s req/s | %s ms | %s ms | %s ms | %s ms | %s MB | %s%% | %s MB |\n" \
                "$label" "$throughput" "$p90" "$p99" "$qp90" "$sp90" "$wmem" "$wcpu" "$amem" \
                >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $label | N/A | N/A | N/A | N/A | N/A | N/A | N/A | N/A |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total requests per config**: ${{ inputs.total_requests || '500' }}" >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
