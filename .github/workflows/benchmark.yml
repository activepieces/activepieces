name: Benchmark

on:
  workflow_dispatch:
    inputs:
      total_requests:
        description: 'Total number of requests for the benchmark'
        required: false
        default: '500'
  schedule:
    - cron: '0 3 * * *'

jobs:
  benchmark:
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 30
    env:
      AP_FILE_STORAGE_LOCATION: ${{ secrets.AP_FILE_STORAGE_LOCATION }}
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      AP_S3_BUCKET: ${{ secrets.AP_S3_BUCKET }}
      AP_S3_ACCESS_KEY_ID: ${{ secrets.AP_S3_ACCESS_KEY_ID }}
      AP_S3_SECRET_ACCESS_KEY: ${{ secrets.AP_S3_SECRET_ACCESS_KEY }}
      AP_S3_ENDPOINT: ${{ secrets.AP_S3_ENDPOINT }}
      AP_S3_REGION: ${{ secrets.AP_S3_REGION }}
      AP_S3_USE_SIGNED_URLS: ${{ secrets.AP_S3_USE_SIGNED_URLS }}
      TOTAL_REQUESTS: ${{ inputs.total_requests || '500' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - apps: 1
            workers: 2
            label: "1app-2workers"
          - apps: 2
            workers: 4
            label: "2app-4workers"
          - apps: 3
            workers: 6
            label: "3app-6workers"
          - apps: 1
            workers: 4
            label: "1app-4workers"
          - apps: 2
            workers: 8
            label: "2app-8workers"
          - apps: 3
            workers: 12
            label: "3app-12workers"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install monorepo deps (for CLI)
        run: bun install --frozen-lockfile

      - name: Build Docker image
        run: docker build -t activepieces-benchmark:local .

      - name: Start benchmark stack
        run: |
          APP_REPLICAS=${{ matrix.apps }} \
          WORKER_REPLICAS=${{ matrix.workers }} \
            docker compose -f benchmark/docker-compose.yml up -d
          echo "Waiting for containers to start..."
          sleep 5
          docker compose -f benchmark/docker-compose.yml ps

      - name: Setup flow, platform API key, and wait for app
        id: setup
        run: |
          chmod +x benchmark/setup.sh
          FLOW_ID=$(benchmark/setup.sh)
          echo "flow_id=$FLOW_ID" >> "$GITHUB_OUTPUT"
          echo "Flow ID: $FLOW_ID"
          test -f /tmp/bench-api-key || { echo "ERROR: /tmp/bench-api-key missing"; exit 1; }

      - name: Load bench API key (masked)
        run: |
          set -euo pipefail
          KEY=$(cat /tmp/bench-api-key)
          echo "::add-mask::$KEY"
          echo "AP_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Start docker stats capture
        run: |
          rm -f /tmp/stats.jsonl
          touch /tmp/bench-running
          (
            while [ -f /tmp/bench-running ]; do
              docker stats --no-stream --format '{{json .}}' \
                >> /tmp/stats.jsonl 2>/dev/null || true
              sleep 2
            done
          ) &
          echo "STATS_PID=$!" >> "$GITHUB_ENV"

      - name: Run benchmark (activepieces CLI)
        run: |
          set -o pipefail
          bun run packages/cli/src/index.ts benchmark \
            --url http://localhost:8080 \
            --requests "${TOTAL_REQUESTS}" \
            --concurrency ${{ matrix.workers }} \
            --json > /tmp/report.json
          echo "--- run summary ---"
          jq '.runs[0].summary, .runs[0].timeline' /tmp/report.json

      - name: Stop docker stats capture
        if: always()
        run: |
          rm -f /tmp/bench-running
          for _ in 1 2 3; do
            if ! kill -0 "${STATS_PID:-0}" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "${STATS_PID:-0}" 2>/dev/null || true
          wc -l /tmp/stats.jsonl || true

      - name: Combine results
        run: |
          node benchmark/aggregate-stats.mjs /tmp/stats.jsonl > /tmp/stats.json
          node benchmark/combine-results.mjs \
            --report /tmp/report.json \
            --stats /tmp/stats.json \
            --sha "${{ github.sha }}" \
            --label "${{ matrix.label }}" \
            --runId "${{ github.run_id }}" \
            --out /tmp/result.json
          cat /tmp/result.json

      - name: Upload result to S3 (scheduled runs only)
        if: github.event_name == 'schedule'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AP_S3_REGION }}
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA_SHORT="${GITHUB_SHA:0:7}"
          KEY="bench/${DATE}-${SHA_SHORT}-${{ matrix.label }}.json"
          aws --endpoint-url "${{ secrets.AP_S3_ENDPOINT }}" \
              s3 cp /tmp/result.json "s3://${{ secrets.AP_S3_BUCKET }}/${KEY}"
          echo "Uploaded s3://${{ secrets.AP_S3_BUCKET }}/${KEY}"

      - name: Detect regression against trailing 14 runs (scheduled runs only)
        if: github.event_name == 'schedule'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AP_S3_REGION }}
          BETTERSTACK_WEBHOOK_URL: ${{ secrets.BETTERSTACK_WEBHOOK_URL }}
        run: |
          mkdir -p /tmp/history
          KEYS=$(aws --endpoint-url "${{ secrets.AP_S3_ENDPOINT }}" \
                    s3 ls "s3://${{ secrets.AP_S3_BUCKET }}/bench/" \
                | awk '{print $4}' | grep "${{ matrix.label }}\.json$" \
                | sort | tail -15)
          echo "History keys:"
          echo "$KEYS"
          TODAY_KEY="$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}-${{ matrix.label }}.json"
          HISTORY_PATHS=""
          for key in $KEYS; do
            [ "$key" = "$TODAY_KEY" ] && continue
            aws --endpoint-url "${{ secrets.AP_S3_ENDPOINT }}" \
                s3 cp "s3://${{ secrets.AP_S3_BUCKET }}/bench/$key" "/tmp/history/$key" >/dev/null
            HISTORY_PATHS="${HISTORY_PATHS}${HISTORY_PATHS:+,}/tmp/history/$key"
          done
          node benchmark/detect-regression.mjs \
            --current /tmp/result.json \
            --history "$HISTORY_PATHS" \
            --label "${{ matrix.label }}" \
            --runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload artifact (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-${{ matrix.label }}
          path: |
            /tmp/report.json
            /tmp/stats.json
            /tmp/stats.jsonl
            /tmp/result.json

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f benchmark/docker-compose.yml logs --tail=100

      - name: Teardown
        if: always()
        run: docker compose -f benchmark/docker-compose.yml down -v

  summary:
    runs-on: ubuntu-latest
    needs: benchmark
    if: always()
    steps:
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: benchmark-results-*
          path: /tmp/results

      - name: Generate comparison table
        run: |
          echo "## Benchmark Results Comparison" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Config | Throughput | Client p90 | Client p99 | Queue p90 | Service p90 | Worker mem | Worker cpu p95 | App mem |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          for dir in /tmp/results/benchmark-results-*/; do
            label=$(basename "$dir" | sed 's/benchmark-results-//')
            json="$dir/result.json"
            if [ -f "$json" ]; then
              throughput=$(jq -r '.throughput.reqSec // 0' "$json")
              p90=$(jq -r '.latency.p90Ms // 0' "$json")
              p99=$(jq -r '.latency.p99Ms // 0' "$json")
              qp90=$(jq -r '.timeline.queueWaitP90Ms // 0' "$json")
              sp90=$(jq -r '.timeline.serviceP90Ms // 0' "$json")
              wmem=$(jq -r '.resources.worker.memMb.max // 0' "$json")
              wcpu=$(jq -r '.resources.worker.cpuPct.p95 // 0' "$json")
              amem=$(jq -r '.resources.app.memMb.max // 0' "$json")
              printf "| %s | %s req/s | %s ms | %s ms | %s ms | %s ms | %s MB | %s%% | %s MB |\n" \
                "$label" "$throughput" "$p90" "$p99" "$qp90" "$sp90" "$wmem" "$wcpu" "$amem" \
                >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $label | N/A | N/A | N/A | N/A | N/A | N/A | N/A | N/A |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total requests per config**: ${{ inputs.total_requests || '500' }}" >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
