name: Reusable - Finalize Translations PR

on:
  workflow_call:
    inputs:
      branch_name:
        description: "Branch name to open PR from"
        required: true
        type: string

jobs:
  finalize:
    runs-on: ubuntu-latest
    concurrency:
      group: finalize-translations
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-

      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Configure git
        run: |
          git config --local user.email "abdulyki+automatedcommits@activepieces.com"
          git config --local user.name "automated-commits-ap"
          git checkout -- bun.lock

      - name: Prepare branch
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          git fetch origin
          if git rev-parse --verify origin/$BRANCH_NAME >/dev/null 2>&1; then
            git checkout -b $BRANCH_NAME origin/$BRANCH_NAME || git checkout $BRANCH_NAME
          else
            git checkout -b $BRANCH_NAME origin/main
          fi

      - name: Merge latest main
        run: |
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            for FILE in $CONFLICTS; do
              if git cat-file -e "origin/main:$FILE" 2>/dev/null; then
                git checkout --theirs -- "$FILE"
                git add -- "$FILE"
              else
                git rm -q -- "$FILE"
              fi
            done
            git commit --no-edit
            for FILE in $(echo "$CONFLICTS" | grep '/src/i18n/translation.json$'); do
              if [ -f "$FILE" ]; then
                npm run cli pieces generate-translation-file -- "$(basename "$(dirname "$(dirname "$(dirname "$FILE")")")")"
              fi
            done
          fi

      - name: Generate translation files for UI
        run: npm run i18n:extract

      - name: Commit UI changes (if any)
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat: update UI translations [skip-changelog]"
          else
            echo "No changes for UI translations in react app"
          fi
          git push origin $BRANCH_NAME

      - name: Check branch ahead of main
        id: ahead
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          git fetch origin
          git checkout $BRANCH_NAME
          if git diff --quiet origin/main HEAD; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Delete unchanged branch
        if: steps.ahead.outputs.changes == 'false'
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: git push origin --delete $BRANCH_NAME

      - name: Rename changed strings in Crowdin
        id: crowdin
        if: steps.ahead.outputs.changes == 'true'
        env:
          CROWDIN_RENAME_TOKEN: ${{ secrets.CROWDIN_RENAME_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_RENAME_DRY_RUN: ${{ vars.CROWDIN_RENAME_DRY_RUN }}
          CROWDIN_AUTO_APPROVERS: ${{ vars.CROWDIN_AUTO_APPROVERS }}
        run: bun tools/scripts/i18n/crowdin-rename.ts --base origin/main --journal "$RUNNER_TEMP/crowdin-rename-journal.jsonl"

      - name: Create Pull Request
        id: pr
        if: steps.ahead.outputs.changes == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.CROWDIN_PRS }}
          script: |
            const branchName = `${{ inputs.branch_name }}`;
            const { data: pullRequest } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'feat: New translation files',
              body: 'Automatically generated translation files for all pieces',
              head: branchName,
              base: 'main',
              draft: false
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              labels: ['skip-changelog', 'translations', 'auto-merge']
            });
            const pull = { owner: context.repo.owner, repo: context.repo.repo, pull_number: pullRequest.number };
            const mergeAttempts = 3;
            let merged = false;
            for (let attempt = 1; attempt <= mergeAttempts && !merged; attempt++) {
              try {
                await github.rest.pulls.merge({ ...pull, merge_method: 'squash' });
                merged = true;
              } catch (error) {
                core.warning(`Merge attempt ${attempt} failed: ${error.message}`);
                const { data: current } = await github.rest.pulls.get(pull).catch(() => ({ data: { merged: false } }));
                merged = current.merged === true;
                if (!merged && attempt < mergeAttempts) {
                  await new Promise((resolve) => setTimeout(resolve, 20000));
                }
              }
            }
            if (!merged) {
              core.setFailed(`The translations PR #${pullRequest.number} did not merge after ${mergeAttempts} attempts.`);
              return;
            }
            core.setOutput('merged', 'true');

            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branchName}`
            }).catch((error) => core.warning(`Could not delete the branch: ${error.message}`));

      - name: Close the translations PR when it did not merge
        id: close
        if: (failure() || cancelled()) && steps.ahead.outputs.changes == 'true' && steps.pr.outputs.merged != 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.CROWDIN_PRS }}
          script: |
            const branchName = `${{ inputs.branch_name }}`;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const listPulls = async () => (await github.rest.pulls.list({ ...repo, head: `${repo.owner}:${branchName}`, state: 'all' })).data;
            const pulls = await listPulls();
            for (const pull of pulls.filter((pull) => pull.state === 'open')) {
              await github.rest.pulls.update({ ...repo, pull_number: pull.number, state: 'closed' });
            }
            const after = await listPulls();
            if (after.some((pull) => pull.merged_at !== null)) {
              core.notice('The translations PR merged after all, so the Crowdin renames stay.');
              return;
            }
            if (after.some((pull) => pull.state === 'open')) {
              core.setFailed('The translations PR is still open, so the Crowdin renames stay. Close or merge it by hand.');
              return;
            }
            if (after.length > 0) {
              await github.rest.git.deleteRef({ ...repo, ref: `heads/${branchName}` }).catch((error) => core.warning(`Could not delete the branch: ${error.message}`));
            }
            core.setOutput('safe_to_undo', 'true');

      - name: Undo the Crowdin renames when the translations PR did not merge
        if: (failure() || cancelled()) && steps.close.outputs.safe_to_undo == 'true' && steps.crowdin.outcome != 'skipped'
        env:
          CROWDIN_RENAME_TOKEN: ${{ secrets.CROWDIN_RENAME_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
        run: bun tools/scripts/i18n/crowdin-rename.ts --undo "$RUNNER_TEMP/crowdin-rename-journal.jsonl" --journal "$RUNNER_TEMP/crowdin-rename-undo-journal.jsonl"

      - name: Keep the Crowdin rename journal
        if: always() && steps.crowdin.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: crowdin-rename-journal
          path: ${{ runner.temp }}/crowdin-rename-*.jsonl
          if-no-files-found: ignore
          retention-days: 90

      - name: Fail when a Crowdin change did not go through
        if: steps.crowdin.outputs.failed != '' && steps.crowdin.outputs.failed != '0'
        run: |
          echo "::error::${{ steps.crowdin.outputs.failed }} Crowdin changes did not go through. A string that was not renamed loses its translations on the next Crowdin sync. See the job summary."
          exit 1
