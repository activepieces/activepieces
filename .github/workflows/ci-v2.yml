name: CI v2
on:
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # turbo --affected diffs against this ref. CI checkouts have origin/<base> but no local main.
  TURBO_SCM_BASE: origin/${{ github.base_ref }}
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.repository == 'activepieces/activepieces'
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
      all: ${{ steps.affected.outputs.all }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find affected packages
        id: affected
        run: |
          set -euo pipefail
          ALL=false
          # Files outside any package (workflows, root config, tools) are invisible to turbo's
          # graph, so a change there runs everything. Docs and markdown never do.
          OUTSIDE_PACKAGES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -vE '^(packages/|docs/|brain/|\.agents/|\.claude/)|\.md$' || true)
          if [ -n "$OUTSIDE_PACKAGES" ]; then
            ALL=true
          fi
          if ! PACKAGES=$(npx --yes turbo@2.9.14 ls --affected --output=json | jq -c '[.packages.items[].name]'); then
            ALL=true
            PACKAGES='[]'
          fi
          echo "all=$ALL" >> "$GITHUB_OUTPUT"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "all=$ALL"
          echo "packages=$PACKAGES"

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.packages != '[]'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          turbo-s3-bucket: ${{ secrets.TURBO_CACHE_S3_BUCKET }}
          turbo-s3-endpoint: ${{ secrets.TURBO_CACHE_S3_ENDPOINT }}
          turbo-s3-access-key-id: ${{ secrets.TURBO_CACHE_S3_ACCESS_KEY_ID }}
          turbo-s3-secret-access-key: ${{ secrets.TURBO_CACHE_S3_SECRET_ACCESS_KEY }}

      - name: Lint affected packages
        if: needs.changes.outputs.all != 'true'
        run: npx turbo run lint --affected

      - name: Lint core packages
        if: needs.changes.outputs.all == 'true'
        run: npm run lint-core

  build-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.packages != '[]'
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      AP_REDIS_HOST: localhost
      AP_REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          turbo-s3-bucket: ${{ secrets.TURBO_CACHE_S3_BUCKET }}
          turbo-s3-endpoint: ${{ secrets.TURBO_CACHE_S3_ENDPOINT }}
          turbo-s3-access-key-id: ${{ secrets.TURBO_CACHE_S3_ACCESS_KEY_ID }}
          turbo-s3-secret-access-key: ${{ secrets.TURBO_CACHE_S3_SECRET_ACCESS_KEY }}

      # One turbo invocation so every package builds once. api is excluded because its `test`
      # script runs the three integration suites serially; the api-tests matrix covers those.
      - name: Typecheck, build and test affected packages
        if: needs.changes.outputs.all != 'true'
        run: npx turbo run typecheck build test --affected --filter='!api'

      - name: Typecheck, build and test core packages
        if: needs.changes.outputs.all == 'true'
        run: npx turbo run typecheck build test $(npx tsx tools/scripts/test-filters.ts)

      - name: Check new migrations are rollback-safe
        run: npx tsx tools/scripts/check-migration-rollback.ts

  api-tests:
    name: api (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(needs.changes.outputs.packages, '"api"')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ce
            tasks: test-ce
          - name: cloud
            tasks: test-cloud
          - name: ee, unit, migrations
            tasks: test-ee test-unit check-migrations
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      # .env.tests pins AP_REDIS_HOST=redis, the alias inside the job's docker network, which a
      # non-container job is not on. dotenv does not override values already in the environment.
      AP_REDIS_HOST: localhost
      AP_REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          turbo-s3-bucket: ${{ secrets.TURBO_CACHE_S3_BUCKET }}
          turbo-s3-endpoint: ${{ secrets.TURBO_CACHE_S3_ENDPOINT }}
          turbo-s3-access-key-id: ${{ secrets.TURBO_CACHE_S3_ACCESS_KEY_ID }}
          turbo-s3-secret-access-key: ${{ secrets.TURBO_CACHE_S3_SECRET_ACCESS_KEY }}

      - run: npx turbo run ${{ matrix.tasks }} --filter=api

  # Only the tool-search integration tests, against real PostgreSQL + pgvector. The api-tests
  # matrix runs them on PGLITE, which papers over node-postgres driver behaviour.
  tool-search-postgres:
    name: tool-search (postgres)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.all == 'true' || contains(needs.changes.outputs.packages, '"api"')
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: activepieces
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: localhost
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_USERNAME: postgres
      AP_POSTGRES_PASSWORD: postgres
      AP_POSTGRES_USE_SSL: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          turbo-s3-bucket: ${{ secrets.TURBO_CACHE_S3_BUCKET }}
          turbo-s3-endpoint: ${{ secrets.TURBO_CACHE_S3_ENDPOINT }}
          turbo-s3-access-key-id: ${{ secrets.TURBO_CACHE_S3_ACCESS_KEY_ID }}
          turbo-s3-secret-access-key: ${{ secrets.TURBO_CACHE_S3_SECRET_ACCESS_KEY }}

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d activepieces \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - run: npx turbo run build --filter=api

      # Serial: every file migrates the one shared service DB on DataSource.initialize().
      - name: Run tool-search integration tests on Postgres
        working-directory: packages/server/api
        run: npx vitest run test/integration/ce/tool-search --bail 1 --passWithNoTests=false --no-file-parallelism
