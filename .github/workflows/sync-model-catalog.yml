name: Sync AI Model Catalog

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'activepieces/activepieces'
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: auto/model-catalog-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CROWDIN_PRS }}

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-

      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Configure git
        run: |
          git config --local user.email "abdulyki+automatedcommits@activepieces.com"
          git config --local user.name "automated-commits-ap"
          git checkout -- bun.lock

      - name: Regenerate catalog
        run: npm run sync-model-catalog

      - name: Commit and push changes (if any)
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Catalog already up to date"
            echo "changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git checkout -b $BRANCH_NAME
          git add -A
          git commit -m "chore(ai): refresh AI model catalog from models.dev [skip-changelog]"
          git push origin $BRANCH_NAME
          echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.commit.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROWDIN_PRS }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore(ai): refresh AI model catalog from models.dev" \
            --label "skip-changelog" \
            --body "Regenerated by \`npm run sync-model-catalog\` from https://models.dev/api.json. Read the diff as data: added blocks are new models, and changed \`inputCostPerMillionTokens\` / \`outputCostPerMillionTokens\` are price moves."

      - name: Drop the branch if no PR was opened
        if: failure() && steps.commit.outputs.changes == 'true'
        run: git push origin --delete "$BRANCH_NAME" || true
