name: Authorize Dispatcher

on:
  workflow_call:
    inputs:
      team:
        description: 'GitHub team slug allowed to run the caller workflow'
        required: true
        type: string
      org:
        description: 'GitHub org owning the team'
        required: false
        type: string
        default: activepieces
    secrets:
      ORG_READ_TOKEN:
        description: 'Fine-grained PAT or GitHub App token with read:org scope'
        required: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          ORG: ${{ inputs.org }}
          TEAM: ${{ inputs.team }}
          ACTOR: ${{ github.triggering_actor }}
        with:
          github-token: ${{ secrets.ORG_READ_TOKEN }}
          script: |
            const { ORG, TEAM, ACTOR } = process.env;
            if (!TEAM) {
              core.setFailed(`No team configured — set the caller workflow's 'team' input (usually via a repo variable).`);
              return;
            }
            try {
              const res = await github.rest.teams.getMembershipForUserInOrg({
                org: ORG,
                team_slug: TEAM,
                username: ACTOR,
              });
              if (res.data.state !== 'active') {
                core.setFailed(`@${ACTOR} membership in @${ORG}/${TEAM} is '${res.data.state}', not 'active'.`);
                return;
              }
              core.info(`@${ACTOR} is an active member of @${ORG}/${TEAM} — dispatch allowed.`);
            } catch (e) {
              if (e.status === 404) {
                core.setFailed(`@${ACTOR} is not a member of @${ORG}/${TEAM} — dispatch denied.`);
                return;
              }
              core.setFailed(`Failed to check team membership: ${e.message}`);
            }
