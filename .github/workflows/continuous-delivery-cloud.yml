name: Continuous Delivery — Cloud

# The Cloud gate. Picks the newest main commit that passed E2E on staging, tests the image staging built
# from it, waits for one approval, then deploys that image to the canary and to the fleet.
# With hotfix_prs, it instead cherry-picks only those merged PRs onto the commit Cloud runs, builds that,
# and sends it through the same checks, approval and deploy.
on:
  schedule:
    - cron: '0 8 * * 0-4' # Sunday to Thursday 08:00 UTC
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit on main to deploy. Empty takes the newest one that passed E2E on staging.'
        type: string
        default: ''
      hotfix_prs:
        description: 'Comma-separated PR numbers already merged into main. Deploys only these on top of what Cloud runs.'
        type: string
        default: ''
      allow_migrations:
        description: 'Let a hotfix PR that changes a migration through'
        type: boolean
        default: false
      skip_migration_check:
        description: 'Deploy even when a pending migration is marked breaking'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  checks: read

jobs:
  cut:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha || steps.hotfix.outputs.sha }}
      image_tag: ${{ steps.pick.outputs.image_tag || steps.hotfix.outputs.image_tag }}
      from_tag: ${{ steps.from.outputs.tag }}
      cloud_sha: ${{ steps.cloud.outputs.sha }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      # The App token can push a pick branch whose commits change workflow files; GITHUB_TOKEN cannot.
      - name: Create GitHub App token
        id: app-token
        if: inputs.hotfix_prs
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/ops.key
          chmod 600 ~/.ssh/ops.key
          cat >>~/.ssh/config <<END
          Host ops
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/ops.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.DEV_OPS_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEV_OPS_HOST }}

      - name: Read the commit Cloud runs
        id: cloud
        run: |
          CLOUD_SHA=$(ssh ops -t -t 'bash -ic "cd mrsk/prod && kamal app version --config-file=config/app.yml 2>&1; exit"' \
            | tr -d '\r' | { grep -oE '^[0-9]+\.[0-9]+\.[0-9]+\.[a-f0-9]{40}\.(beta|pick)$' || true; } | head -1 | cut -d. -f4)
          if [ -z "$CLOUD_SHA" ]; then
            echo "::error::Could not read the version the Cloud fleet runs"
            exit 1
          fi
          echo "sha=$CLOUD_SHA" >> "$GITHUB_OUTPUT"
          echo "Cloud runs \`$CLOUD_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      # A scheduled run stops when the fleet already runs the candidate, so a quiet day asks for no approval.
      - name: Pick the candidate
        id: pick
        if: ${{ !inputs.hotfix_prs }}
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          CLOUD_SHA: ${{ steps.cloud.outputs.sha }}
        run: |
          e2e_passed() {
            [ -n "$(gh api "repos/$GITHUB_REPOSITORY/commits/$1/check-runs?check_name=e2e-staging" \
              --jq '.check_runs[] | select(.conclusion == "success") | .id')" ]
          }
          if [ -n "$INPUT_SHA" ]; then
            SHA=$(git rev-parse --verify "$INPUT_SHA^{commit}")
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::error::$SHA is not on main"
              exit 1
            fi
            if ! e2e_passed "$SHA"; then
              echo "::error::e2e-staging did not pass on $SHA"
              exit 1
            fi
          else
            SHA=""
            for COMMIT in $(git rev-list --first-parent -n 30 origin/main); do
              if e2e_passed "$COMMIT"; then
                SHA=$COMMIT
                break
              fi
            done
            if [ -z "$SHA" ]; then
              echo "::error::e2e-staging did not pass on any of the last 30 commits on main"
              exit 1
            fi
          fi
          IMAGE_TAG="$(git show "$SHA:package.json" | jq -r .version).$SHA.beta"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Candidate \`$SHA\`, image \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$CLOUD_SHA" = "$SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Cloud already runs the candidate. Nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Each named PR's squash commit is cherry-picked from main, oldest first, onto the commit Cloud runs.
      # The branch is pushed so the commit Cloud will run stays in the repository.
      - name: Cherry-pick the hotfix PRs onto what Cloud runs
        id: hotfix
        if: inputs.hotfix_prs
        env:
          GH_TOKEN: ${{ github.token }}
          HOTFIX_PRS: ${{ inputs.hotfix_prs }}
          INPUT_SHA: ${{ inputs.sha }}
          ALLOW_MIGRATIONS: ${{ inputs.allow_migrations }}
          CLOUD_SHA: ${{ steps.cloud.outputs.sha }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            echo "::error::Set either sha or hotfix_prs, not both"
            exit 1
          fi
          COMMITS=""
          for PR in $(echo "$HOTFIX_PRS" | tr ',#' '  '); do
            read -r STATE BASE MERGE <<< "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,mergeCommit \
              --jq '"\(.state) \(.baseRefName) \(.mergeCommit.oid // "")"')"
            if [ "$STATE" != MERGED ] || [ "$BASE" != main ] || [ -z "$MERGE" ] || ! git merge-base --is-ancestor "$MERGE" origin/main; then
              echo "::error::#$PR is not merged into main"
              exit 1
            fi
            if git log --format=%s "$CLOUD_SHA" | grep -qE "\(#$PR\)$"; then
              echo "::error::#$PR is already on Cloud"
              exit 1
            fi
            MIGRATIONS=$(git diff --name-only "$MERGE^" "$MERGE" -- packages/server/api/src/app/database/migration/ packages/server/api/src/app/ee/database/migrations/)
            if [ -n "$MIGRATIONS" ] && [ "$ALLOW_MIGRATIONS" != true ]; then
              echo "::error::#$PR changes a migration ($MIGRATIONS). It may need schema changes Cloud does not have yet. Set allow_migrations to pick it anyway."
              exit 1
            fi
            COMMITS="$COMMITS$MERGE"$'\n'
          done
          BRANCH="hotfix/cloud/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$BRANCH" "$CLOUD_SHA"
          for COMMIT in $(git rev-list --first-parent --reverse origin/main | grep -Fx -f <(printf '%s' "$COMMITS")); do
            if ! git cherry-pick -x "$COMMIT"; then
              git cherry-pick --abort
              echo "::error::$(git log -1 --format=%s "$COMMIT") does not apply cleanly on what Cloud runs"
              exit 1
            fi
          done
          git push origin "$BRANCH"
          SHA=$(git rev-parse HEAD)
          IMAGE_TAG="$(git show "$SHA:package.json" | jq -r .version).$SHA.pick"
          EARLIER=$(git log --first-parent --format=%s "$(git merge-base "$CLOUD_SHA" origin/main)..$CLOUD_SHA" | grep -oE '#[0-9]+\)$' | tr -d ')' | paste -sd ' ' || true)
          ADDED=$(git log --first-parent --reverse --format=%s "$CLOUD_SHA..$SHA" | grep -oE '#[0-9]+\)$' | tr -d ')' | paste -sd ' ')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          {
            echo "**Hotfix:** Cloud runs \`${CLOUD_SHA:0:10}\`${EARLIER:+ (main plus $EARLIER)}. This run adds $ADDED."
            echo
            echo "Branch \`$BRANCH\`, image \`$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pick the release the upgrade test starts from
        id: from
        if: steps.pick.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FROM_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases -L 50 --json tagName --jq '.[].tagName' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-hotfix\.[0-9]+)?$' | sort -V | tail -1)
          echo "tag=$FROM_TAG" >> "$GITHUB_OUTPUT"
          echo "Upgrade test from \`$FROM_TAG\`" >> "$GITHUB_STEP_SUMMARY"

  # Staging never built a hotfix combination, so the gate builds it. The .pick tag never replaces a .beta image.
  build-pick:
    needs: cut
    if: inputs.hotfix_prs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.cut.outputs.sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: depot/setup-action@v1
      - uses: depot/build-push-action@v1
        with:
          project: du7O4b0e8P
          token: ${{ secrets.DEPOT_PROJECT_TOKEN }}
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          no-cache: true
          tags: ghcr.io/activepieces/activepieces-cloud:${{ needs.cut.outputs.image_tag }}

  e2e-matrix:
    needs: [cut, build-pick]
    if: always() && needs.cut.result == 'success' && needs.cut.outputs.skip != 'true' && (needs.build-pick.result == 'success' || needs.build-pick.result == 'skipped')
    uses: ./.github/workflows/e2e-matrix.yml
    with:
      image: ghcr.io/activepieces/activepieces-cloud:${{ needs.cut.outputs.image_tag }}
      ref: ${{ needs.cut.outputs.sha }}
    secrets: inherit

  upgrade-test:
    needs: [cut, build-pick]
    if: always() && needs.cut.result == 'success' && needs.cut.outputs.skip != 'true' && (needs.build-pick.result == 'success' || needs.build-pick.result == 'skipped')
    uses: ./.github/workflows/upgrade-test.yml
    with:
      image: ghcr.io/activepieces/activepieces-cloud:${{ needs.cut.outputs.image_tag }}
      ref: ${{ needs.cut.outputs.sha }}
      from_tag: ${{ needs.cut.outputs.from_tag }}
    secrets: inherit

  # Posts each check's result on the candidate SHA, and names the check that failed.
  report:
    needs: [cut, e2e-matrix, upgrade-test]
    if: always() && needs.cut.result == 'success' && needs.cut.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post the check results on the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.cut.outputs.sha }}
          FROM_TAG: ${{ needs.cut.outputs.from_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          E2E_RESULT: ${{ needs.e2e-matrix.result }}
          UPGRADE_RESULT: ${{ needs.upgrade-test.result }}
          SWAPPED: ${{ needs.upgrade-test.outputs.swapped }}
        run: |
          post() {
            STATE=failure
            if [ "$2" = success ]; then STATE=success; fi
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$STATE" -f context="$1" -f target_url="$RUN_URL" -f description="$3" > /dev/null
            echo "- \`$1\`: $3" >> "$GITHUB_STEP_SUMMARY"
            if [ "$STATE" != success ]; then echo "::error::$1 failed on $SHA: $3"; fi
          }
          post e2e-matrix "$E2E_RESULT" "E2E matrix $E2E_RESULT"
          if [ "$UPGRADE_RESULT" = success ]; then
            post upgrade-test "$UPGRADE_RESULT" "Upgrade from $FROM_TAG passed"
          elif [ "$SWAPPED" = true ]; then
            post upgrade-test "$UPGRADE_RESULT" "The candidate broke after the upgrade from $FROM_TAG"
          else
            post upgrade-test "$UPGRADE_RESULT" "Setup failed before the upgrade from $FROM_TAG, not the candidate"
          fi

  # Lists the tickets between the commit Cloud runs and the candidate, so the approver sees them.
  # Uses the path filter of the Linear release below. Never blocks the gate.
  tickets:
    needs: cut
    if: needs.cut.outputs.skip != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: List the tickets in the candidate
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SHA: ${{ needs.cut.outputs.sha }}
          CLOUD_SHA: ${{ needs.cut.outputs.cloud_sha }}
        run: |
          echo "## Tickets in \`${SHA:0:10}\`" >> "$GITHUB_STEP_SUMMARY"
          PRS=$(git log --first-parent --format=%s "$CLOUD_SHA..$SHA" -- . \
            ':!packages/pieces/community' ':!packages/pieces/core' ':!packages/pieces/custom' ':!bun.lock' ':!tsconfig.base.json' ':!docs' \
            | { grep -oE '\(#[0-9]+\)$' || true; } | tr -d '(#)')
          echo "| Ticket | PR |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for PR in $PRS; do
            URL="https://github.com/$GITHUB_REPOSITORY/pull/$PR"
            TICKETS=$(jq -n --arg url "$URL" '{query: "query($url: String!) { attachmentsForURL(url: $url) { nodes { issue { identifier title url } } } }", variables: {url: $url}}' \
              | curl -sf https://api.linear.app/graphql -H "Authorization: $LINEAR_API_KEY" -H 'Content-Type: application/json' -d @- \
              | jq -r '[.data.attachmentsForURL.nodes[].issue | "[\(.identifier)](\(.url)) \(.title | gsub("\\|"; "/"))"] | unique | join("<br>")')
            echo "| ${TICKETS:-no ticket} | [#$PR]($URL) |" >> "$GITHUB_STEP_SUMMARY"
          done

  # The one approval. A newer candidate cancels an older one that still waits here.
  approve:
    needs: [cut, e2e-matrix, upgrade-test, tickets]
    if: needs.cut.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cloud.activepieces.com
    concurrency:
      group: ${{ inputs.hotfix_prs && format('cloud-approval-hotfix-{0}', github.run_id) || 'cloud-approval' }}
      cancel-in-progress: true
    steps:
      - run: echo "Approved ${{ needs.cut.outputs.image_tag }}"

  # One job holds the production lock from the migration check through the fleet deploy, because
  # GitHub keeps only one pending job per group: a lock per job lets a later run slip between the
  # canary and the fleet. The group matches continuous-delivery-rollback.yml.
  deploy:
    needs: [cut, approve]
    runs-on: ubuntu-latest
    concurrency:
      group: promote-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.cut.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        if: inputs.skip_migration_check != true
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        if: inputs.skip_migration_check != true
        with:
          bun-version: latest

      - name: Install dependencies
        if: inputs.skip_migration_check != true
        run: bun install --frozen-lockfile

      - name: Build shared and server-utils packages
        if: inputs.skip_migration_check != true
        run: bunx turbo run build --filter=@activepieces/shared --filter=@activepieces/server-utils

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/ops.key
          chmod 600 ~/.ssh/ops.key
          cat >>~/.ssh/config <<END
          Host ops
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/ops.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.DEV_OPS_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEV_OPS_HOST }}

      # Read again under the lock: an approval can wait for days, and Cloud can change in that time.
      # The candidate must keep every PR that Cloud runs, so no deploy drops a fix that went out
      # through another path or replaces newer code with older code.
      - name: Check that the candidate keeps everything Cloud runs
        env:
          SHA: ${{ needs.cut.outputs.sha }}
          CUT_CLOUD_SHA: ${{ needs.cut.outputs.cloud_sha }}
        run: |
          read_version() {
            ssh ops -t -t "bash -ic \"cd mrsk/prod && kamal app version --config-file=$1 2>&1; exit\"" \
              | tr -d '\r' | { grep -oE '^[0-9]+\.[0-9]+\.[0-9]+\.[a-f0-9]{40}\.(beta|pick)$' || true; } | sort -u
          }
          FLEET=$(read_version config/app.yml)
          CANARY=$(read_version config/app-canary.yml)
          if [ -z "$FLEET" ] || [ "$(echo "$FLEET" | wc -l)" -ne 1 ]; then
            echo "::error::The fleet does not run one readable version: ${FLEET:-none}"
            exit 1
          fi
          if [ "$CANARY" != "$FLEET" ]; then
            echo "::error::The canary runs ${CANARY:-nothing readable}, the fleet runs $FLEET. Deploy the fleet's image to the canary first."
            exit 1
          fi
          CLOUD_SHA=$(echo "$FLEET" | cut -d. -f4)
          if [ "$CLOUD_SHA" != "$CUT_CLOUD_SHA" ]; then
            echo "::error::Cloud moved from $CUT_CLOUD_SHA to $CLOUD_SHA after this run picked $SHA. Start a new run."
            exit 1
          fi
          if ! git cat-file -e "$CLOUD_SHA^{commit}"; then
            echo "::error::Cloud runs $CLOUD_SHA, which is not in this repository"
            exit 1
          fi
          MISSING=""
          for COMMIT in $(git rev-list "$(git merge-base "$CLOUD_SHA" "$SHA")..$CLOUD_SHA"); do
            PR=$(git log -1 --format=%s "$COMMIT" | grep -oE '#[0-9]+\)$' | tr -d '#)' || true)
            if [ -z "$PR" ] || ! git log --format=%s "$SHA" | grep -qE "\(#$PR\)$"; then
              MISSING="$MISSING$(git log -1 --format='%h %s' "$COMMIT")"$'\n'
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::$SHA does not contain these commits that Cloud runs. Deploying it would remove them."
            printf '%s' "$MISSING"
            exit 1
          fi

      # The canary app runs migrations on the shared database at boot, so a pending migration marked
      # breaking stops the deploy here, before any host changes. An unreadable manifest fails the job.
      - name: Get current canary manifest
        id: current-manifest
        if: inputs.skip_migration_check != true
        run: |
          MANIFEST=$(ssh ops -t -t 'bash -ic "cd mrsk/prod && kamal app exec \
            --reuse \
            --config-file=config/app-canary.yml -- \
            cat /usr/src/app/packages/server/api/dist/src/migration-manifest.json; exit"' \
            2>/dev/null | tr -d '\r' | { grep '^\[' || true; } | head -1)
          if ! echo "$MANIFEST" | jq -e 'type == "array" and length > 0' > /dev/null 2>&1; then
            echo "::error::Could not read the migration manifest of the running canary"
            exit 1
          fi
          echo "json=$MANIFEST" >> $GITHUB_OUTPUT

      - name: Check for breaking migrations
        id: check
        if: inputs.skip_migration_check != true
        run: bunx tsx tools/scripts/check-manifest-migrations.ts '${{ steps.current-manifest.outputs.json }}'

      - name: Fail on breaking migrations
        if: steps.check.outputs.has_breaking == 'true'
        run: |
          echo "::error::Breaking migrations pending on ${{ needs.cut.outputs.sha }}: ${{ steps.check.outputs.breaking_names }}"
          exit 1

      - name: Deploy canary app
        run: |
          ssh ops -t -t 'bash -ic "cd mrsk/prod && kamal deploy --version ${{ needs.cut.outputs.image_tag }} --config-file=config/app-canary.yml --skip-push; exit"'

      - name: Deploy canary workers
        run: |
          ssh ops -t -t 'bash -ic "cd mrsk/prod && kamal deploy --version ${{ needs.cut.outputs.image_tag }} --config-file=config/worker-canary.yml --skip-push; exit"'

      - name: Deploy App to production
        run: |
          ssh ops -t -t 'bash -ic "cd mrsk/prod && kamal deploy --version ${{ needs.cut.outputs.image_tag }} --config-file=config/app.yml --skip-push; exit"'

      - name: Deploy Workers to production
        run: |
          ssh ops -t -t 'bash -ic "cd mrsk/prod && kamal deploy --version ${{ needs.cut.outputs.image_tag }} --config-file=config/worker.yml --skip-push; exit"'

      - name: Notify on-call channel
        env:
          WEBHOOK: ${{ secrets.DISCORD_ON_CALL_WEBHOOK }}
          IMAGE_TAG: ${{ needs.cut.outputs.image_tag }}
          DEPLOY_KIND: ${{ inputs.hotfix_prs && format('hotfix {0}', inputs.hotfix_prs) || github.event_name == 'schedule' && 'daily candidate' || 'manual run' }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"🚀 **Cloud production deployed** ($DEPLOY_KIND)\\n\\n**Version:** \`$IMAGE_TAG\`\\n**Changelog:** ${{ github.server_url }}/${{ github.repository }}/releases/latest\\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK"

      # A failure after the canary step can leave the canary and the fleet on different images.
      - name: Notify on-call channel of a failed deploy
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_ON_CALL_WEBHOOK }}
          IMAGE_TAG: ${{ needs.cut.outputs.image_tag }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"🔥 **Cloud production deploy failed**\\n\\n**Version:** \`$IMAGE_TAG\`\\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK"

  # Records the deploy in the Linear "Cloud" release pipeline. Never fails the workflow.
  # A rollback, an emergency deploy or a hotfix deploy does not sync; the next normal deploy records it.
  linear-release:
    needs: [cut, deploy]
    if: ${{ !inputs.hotfix_prs }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.cut.outputs.sha }}
          fetch-depth: 0
      - uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_KEY_CLOUD }}
          include_paths: '!packages/pieces/community/**,!packages/pieces/core/**,!packages/pieces/custom/**,!bun.lock,!tsconfig.base.json,!docs/**'
          no_branch_ref_detection: 'true'
          links: Run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
