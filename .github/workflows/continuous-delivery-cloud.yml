name: Continuous Delivery — Cloud

on:
  # schedule:
    # - cron: '0 9 * * 0' # Sunday 9 AM UTC — promote release candidate to prod
  workflow_call:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - cloud-hotfix # Build from current branch and deploy directly to production, bypassing staging
      skip_migration_check:
        description: 'Deploy even when a pending migration is marked breaking'
        type: boolean
        required: false
        default: false

jobs:
  guard:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'cloud-hotfix'
    runs-on: ubuntu-latest
    steps:
      - name: Check proximity to scheduled promotion
        run: |
          NOW=$(date -u +%s)
          DOW=$(date -u +%u)  # ISO: 1=Mon … 7=Sun
          if [ "$DOW" -eq 7 ]; then
            TODAY_9AM=$(date -u -d "today 09:00" +%s)
            if [ "$NOW" -lt "$TODAY_9AM" ]; then
              NEXT_RUN=$TODAY_9AM
            else
              NEXT_RUN=$(date -u -d "next sunday 09:00" +%s)
            fi
          else
            NEXT_RUN=$(date -u -d "next sunday 09:00" +%s)
          fi
          SECONDS_UNTIL=$(( NEXT_RUN - NOW ))
          MINS=$(( SECONDS_UNTIL / 60 ))
          if [ "$SECONDS_UNTIL" -le 3600 ]; then
            echo "Scheduled promotion is in ${MINS}m — no hotfix needed, wait for the scheduled run."
            exit 1
          fi
          echo "Next scheduled promotion in ${MINS}m — proceeding with hotfix."

  build-image:
    needs: [guard]
    if: github.event_name != 'schedule' && needs.guard.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Set image tag
        id: set-tag
        run: |
          RELEASE=$(node --print "require('./package.json').version")
          echo "image_tag=${RELEASE}.${{ github.sha }}.beta" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: depot/setup-action@v1
      - uses: depot/build-push-action@v1
        with:
          project: du7O4b0e8P
          token: ${{ secrets.DEPOT_PROJECT_TOKEN }}
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          no-cache: true
          tags: ghcr.io/activepieces/activepieces-cloud:${{ steps.set-tag.outputs.image_tag }}

  check-migrations:
    if: inputs.skip_migration_check != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared and server-utils packages
        run: bunx turbo run build --filter=@activepieces/shared --filter=@activepieces/server-utils

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/ops.key
          chmod 600 ~/.ssh/ops.key
          cat >>~/.ssh/config <<END
          Host ops
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/ops.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.DEV_OPS_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEV_OPS_HOST }}

      - name: Get current production manifest
        id: current-manifest
        run: |
          MANIFEST=$(ssh ops -t -t 'bash -ic "cd mrsk/prod && kamal app exec \
            --reuse --primary \
            --config-file=config/app.yml -- \
            cat /usr/src/app/packages/server/api/dist/src/migration-manifest.json; exit"' \
            2>/dev/null | grep '^\[' || echo '[]')
          echo "json=$MANIFEST" >> $GITHUB_OUTPUT

      - name: Check for breaking migrations
        id: check
        run: bunx tsx tools/scripts/check-manifest-migrations.ts '${{ steps.current-manifest.outputs.json }}'

      - name: Fail on breaking migrations
        if: steps.check.outputs.has_breaking == 'true'
        run: |
          echo "Breaking migrations detected: ${{ steps.check.outputs.breaking_names }}"
          exit 1

  promote-to-production:
    needs: [guard, build-image, check-migrations]
    if: |
      always() &&
      needs.guard.result != 'failure' &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') &&
      (needs.check-migrations.result == 'success' || needs.check-migrations.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: https://cloud.activepieces.com
    concurrency:
      group: promote-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/ops.key
          chmod 600 ~/.ssh/ops.key
          cat >>~/.ssh/config <<END
          Host ops
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/ops.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.DEV_OPS_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEV_OPS_HOST }}

      - name: Set image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image_tag=${{ needs.build-image.outputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=release-candidate" >> $GITHUB_OUTPUT
          fi

      - name: Deploy App to production
        run: |
          ssh ops -t -t 'bash -ic "cd mrsk/prod && kamal deploy --version ${{ steps.image.outputs.image_tag }} --config-file=config/app.yml --skip-push; exit"'

      - name: Deploy Workers to production
        run: |
          ssh ops -t -t 'bash -ic "cd mrsk/prod && kamal deploy --version ${{ steps.image.outputs.image_tag }} --config-file=config/worker.yml --skip-push; exit"'

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create deploy branch
        if: github.event_name == 'schedule'
        run: |
          SHA=$(git rev-parse refs/tags/release-candidate 2>/dev/null || git rev-parse release-candidate)
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="deploy/cloud/$DATE"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$BRANCH" "$SHA"
          git push origin "$BRANCH" --force
          echo "Created $BRANCH at $SHA"

      - name: Notify on-call channel
        env:
          WEBHOOK: ${{ secrets.DISCORD_ON_CALL_WEBHOOK }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          DEPLOY_KIND: ${{ github.event_name == 'workflow_dispatch' && 'hotfix' || 'scheduled promotion' }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"🚀 **Cloud production deployed** ($DEPLOY_KIND)\\n\\n**Version:** \`$IMAGE_TAG\`\\n**Changelog:** ${{ github.server_url }}/${{ github.repository }}/releases/latest\\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK"

  # Records the deploy in the Linear "Cloud" release pipeline. Never fails the workflow.
  # Only a dispatch deploys an image built from github.sha; a rollback or emergency deploy does not sync.
  linear-release:
    needs: promote-to-production
    if: always() && needs.promote-to-production.result == 'success' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_KEY_CLOUD }}
          include_paths: '!packages/pieces/community/**,!packages/pieces/core/**,!packages/pieces/custom/**,!bun.lock,!tsconfig.base.json,!docs/**'
          no_branch_ref_detection: 'true'
          links: Run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Run smoke test after scheduled promotion
  smoke-test:
    needs: promote-to-production
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/smoke-test.yml
    secrets: inherit
